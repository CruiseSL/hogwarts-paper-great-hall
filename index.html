<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>霍格沃茨大礼堂 · 纸雕漫游</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #514858;
      color: #e6ceb0;
    }
    body {
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    header,
    footer,
    #pad {
      position: fixed;
      z-index: 2;
    }
    header {
      top: clamp(14px, 3vw, 36px);
      left: clamp(14px, 3vw, 36px);
      pointer-events: none;
      background: #382e3cf2;
      color: #f6ddb2;
      box-shadow: 2px 4px 0 #211a2980;
      padding: 11px 21px 13px 19px;
      border-left: 5px solid #bc9058;
      transform: rotate(-0.65deg);
    }
    h1 {
      font-family: "Songti SC", "Noto Serif CJK SC", serif;
      font-size: clamp(19px, 1.8vw, 28px);
      letter-spacing: 0.14em;
      margin: 0;
    }
    header p {
      font-size: 11px;
      letter-spacing: 0.1em;
      margin: 3px 0 0;
    }
    footer {
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #392e3eed;
      color: #f6dfbb;
      padding: 8px 15px;
      line-height: 1.4;
      box-shadow: 1px 3px 0 #211a2970;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }
    #pad {
      display: none;
      bottom: 18px;
      right: 14px;
      grid-template-columns: repeat(3, 38px);
      grid-template-rows: repeat(2, 38px);
      gap: 3px;
    }
    #pad button {
      touch-action: none;
      background: #fff4dfdf;
      color: #4e324a;
      border: 1px solid #a37d54;
      border-radius: 6px;
      font: 20px system-ui;
      user-select: none;
    }
    #pad button:first-child {
      grid-column: 2;
    }
    #pad button:nth-child(2) {
      grid-column: 1;
    }
    #status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font:
        19px "Songti SC",
        serif;
      text-align: center;
      pointer-events: none;
    }
    #status:empty {
      display: none;
    }
    @media (pointer: coarse) {
      #pad {
        display: grid;
      }
      footer {
        display: none;
      }
    }
    @media (max-width: 560px) {
      header {
        padding: 7px 12px;
      }
      header p {
        font-size: 10px;
      }
    }
    .project-files {
      position: fixed;
      top: clamp(14px, 3vw, 36px);
      right: clamp(14px, 3vw, 36px);
      z-index: 2;
      display: flex;
      gap: 1em;
      background: #382e3cf2;
      padding: 8px 12px;
      font-size: 12px;
    }
    .project-files a { color: #f6ddb2; text-underline-offset: 3px; }
  </style>
  <nav class="project-files" aria-label="项目资料">
    <a href="hogwarts-papercraft-project.zip" download>下载项目</a>
    <a href="prompts.txt" target="_blank" rel="noopener">制作提示词</a>
  </nav>
  <header>
    <h1>霍格沃茨大礼堂</h1>
    <p id="place">中央过道</p>
  </header>
  <footer>方向键移动哈利　·　拖动环顾　·　点击折叠或展开</footer>
  <div id="pad" aria-label="移动方向">
    <button aria-label="向上" data-key="ArrowUp">↑</button
    ><button aria-label="向左" data-key="ArrowLeft">←</button
    ><button aria-label="向下" data-key="ArrowDown">↓</button
    ><button aria-label="向右" data-key="ArrowRight">→</button>
  </div>
  <div id="status" role="status">正在展开大礼堂…</div>
  <script>
    window.addEventListener("error", () => {
      const s = document.getElementById("status");
      if (s.textContent)
        s.textContent = "礼堂未能加载，请使用支持 WebGL 2 的浏览器重新打开。";
    });
  </script>
